  accent-light: "#2a2520"
  accent-dark: "#c08030"
  text: "#e8e0d8"
  bg: "#1a1816"
  code-bg: "#252220"

fonts:
  heading: "'Georgia', 'Times New Roman', serif"
  body: "'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
  mono: "'JetBrains Mono', 'Fira Code', 'Consolas', monospace"